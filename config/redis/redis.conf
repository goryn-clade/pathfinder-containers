# Redis configuration for Pathfinder

# Enable AOF persistence
appendonly yes

# Maximum memory allowed
maxmemory 64mb

# Eviction policy: remove any key using LRU when maxmemory is reached
maxmemory-policy allkeys-lru

# Default timeout for idle clients (0 = no timeout)
timeout 0

# TCP backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# Loglevel
loglevel notice

# Number of databases
databases 16
