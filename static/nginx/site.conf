server {
  listen 80;
  listen [::]:80;
  #listen [::]:80 default_server ipv6only=on;
  server_name $DOMAIN;




  # Path to static files
  root   /var/www/html/pathfinder/;
  index index.php index.html index.htm;

  # Specify a charset
  charset utf-8;


  # Logging ===================================================================================================================
  # Suppress high-frequency R2Z2 polling requests from access log
  location ^~ /api/Killboard/r2z2/ {
      access_log off;
      try_files $uri $uri/ /index.php?q=$uri&$args;
  }


  # /setup and /api/Setup/ pass directly to index.php with long fastcgi timeouts.
  # try_files → ~ \.php$ internal-redirect loses per-location fastcgi directives,
  # so these locations own their fastcgi_pass rather than relying on that chain.
  location = /setup {
    auth_basic "Setup Login";
    auth_basic_user_file /etc/nginx/.setup_pass;
    fastcgi_pass 127.0.0.1:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 30s;
    fastcgi_connect_timeout 10s;
  }

  location ^~ /api/Setup/ {
    limit_req zone=api burst=60 nodelay;
    fastcgi_pass 127.0.0.1:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 30s;
    fastcgi_connect_timeout 10s;
  }

  # Rate-limit all other API endpoints
  location ^~ /api/ {
      limit_req zone=api burst=60 nodelay;
      try_files $uri $uri/ /index.php?q=$uri&$args;
  }

   location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to index.php
            try_files $uri $uri/ /index.php?q=$uri&$args;
        }

        # redirect server error pages to the static page /50x.html
        #
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        # Security headers (F3 already sets X-Frame-Options, X-Content-Type-Options, X-XSS-Protection)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        fastcgi_hide_header X-Powered-By;

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_read_timeout 40s;
            fastcgi_send_timeout 30s;
            fastcgi_connect_timeout 10s;
        }

        location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml)$ {
            expires 5d;
        }

	# hotfix for info disclosure
        location ~* \.(ini)$ {
            log_not_found off;
            deny all;
        }
        location ~* \.(log)$ {
            log_not_found off;
            deny all;
        }

        # deny access to . files, for security
        #
        location ~ /\. {
            log_not_found off;
            deny all;
     }

 location /ws/map/update {
    proxy_pass http://websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 8h;
    proxy_send_timeout 5s;
    proxy_connect_timeout 3s;
    proxy_buffering off;
  }
  # static sources
  location /public/ {
    sendfile                                    on;
    tcp_nopush                                  on;
    tcp_nodelay                                 on;
    keepalive_timeout                           10s;
    sendfile_max_chunk                          512k;
  }

}
