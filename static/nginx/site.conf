server {
  listen 80;
  listen [::]:80;
  #listen [::]:80 default_server ipv6only=on;
  server_name $DOMAIN;




  # Path to static files
  root   /var/www/html/pathfinder/;
  index index.php index.html index.htm;

  # Specify a charset
  charset utf-8;


  # Logging ===================================================================================================================
  # Suppress high-frequency R2Z2 polling requests from access log
  location ^~ /api/Killboard/r2z2/ {
      access_log off;
      # prefix match wins over ^~ /api/ below -> needs its own limit (higher burst: polled often)
      limit_req zone=api burst=120 nodelay;
      try_files $uri $uri/ /index.php?q=$uri&$args;
  }


  # Internal folders and build files are never served (the web root is the whole app folder).
  # Regex locations are checked in order, so these come before the static-file rule below.
  location ~ ^/(app|vendor|tmp|logs|history|export)/ {
    return 404;
  }
  location ~ ^/(composer(-dev)?\.json|composer\.lock|package(-lock)?\.json|gulpfile\.js)$ {
    return 404;
  }

  # /setup and /api/Setup/ pass directly to index.php with long fastcgi timeouts.
  # try_files → ~ \.php$ internal-redirect loses per-location fastcgi directives,
  # so these locations own their fastcgi_pass rather than relying on that chain.
  # Case-insensitive regex, not "= /setup": the app used to route /SETUP, /Setup and
  # /setup%2F to the setup page too, and those skipped Basic Auth. PF_SETUP_AUTH tells
  # the app that this request came through here (Controller\Setup::beforeroute checks it).
  location ~* ^/setup(/|$) {
    auth_basic "Setup Login";
    auth_basic_user_file /etc/nginx/.setup_pass;
    # caps Basic Auth password guessing per IP (pages zone: see nginx.conf)
    limit_req zone=pages burst=20 nodelay;
    limit_req_status 429;
    fastcgi_pass 127.0.0.1:9000;
    include fastcgi_params;
    # F3's ip() trusts Client-IP, then X-Forwarded-For: hand it the real_ip-corrected address
    fastcgi_param HTTP_CLIENT_IP "";
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PF_SETUP_AUTH 1;
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 30s;
    fastcgi_connect_timeout 10s;
  }

  location ^~ /api/Setup/ {
    limit_req zone=api burst=60 nodelay;
    fastcgi_pass 127.0.0.1:9000;
    include fastcgi_params;
    # F3's ip() trusts Client-IP, then X-Forwarded-For: hand it the real_ip-corrected address
    fastcgi_param HTTP_CLIENT_IP "";
    fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 120s;
    fastcgi_send_timeout 30s;
    fastcgi_connect_timeout 10s;
  }

  # Rate-limit all other API endpoints
  location ^~ /api/ {
      limit_req zone=api burst=60 nodelay;
      try_files $uri $uri/ /index.php?q=$uri&$args;
  }

  # Other spellings (/Api/, /API/) now 404 in the app (CASELESS = FALSE),
  # but still rate-limit them so they can't be used to load PHP without a limit
  location ~* ^/api/ {
      limit_req zone=api burst=60 nodelay;
      try_files $uri $uri/ /index.php?q=$uri&$args;
  }

   location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to index.php
            # Pages and /sso/ routes: 10 req/s per IP plus a burst of 20 (pages zone: see nginx.conf).
            # The limit counts once per request, so the redirect to /index.php below is not counted twice.
            limit_req zone=pages burst=20 nodelay;
            limit_req_status 429;
            try_files $uri $uri/ /index.php?q=$uri&$args;
        }

        # redirect server error pages to the static page /50x.html
        #
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        # Security headers (F3 already sets X-Frame-Options, X-Content-Type-Options, X-XSS-Protection)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "interest-cohort=()" always;
        fastcgi_hide_header X-Powered-By;

        # pass the front controller to FastCGI server listening on 127.0.0.1:9000
        # -> only index.php runs; every route reaches it through try_files above
        #
        location = /index.php {
            # direct /index.php requests get the pages limit too
            limit_req zone=pages burst=20 nodelay;
            limit_req_status 429;
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            include fastcgi_params;
            # F3's ip() trusts Client-IP, then X-Forwarded-For: hand it the real_ip-corrected address
            fastcgi_param HTTP_CLIENT_IP "";
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;

            fastcgi_read_timeout 40s;
            fastcgi_send_timeout 30s;
            fastcgi_connect_timeout 10s;
        }

        # any other .php file (vendor scripts, compiled templates, app classes) must not run
        location ~ \.php$ {
            return 404;
        }

        # Built JS and CSS: send the pre-compressed .br or .gz copy next to each file
        # (made in the Dockerfile), instead of compressing on every request. Files
        # without a copy are still gzipped on the fly. Regex locations are checked in
        # order, so this one comes before the general JS/CSS rule below; keep
        # their "expires" the same.
        location ~* ^/public/.+\.(css|js)$ {
            gzip_static on;
            brotli_static on;
            expires -1;
        }

        location ~* \.(jpg|jpeg|gif|png|ico|xml)$ {
            expires 5d;
        }

        # JS/CSS keep the same URL until VERSION changes, so browsers must revalidate
        # (304 via ETag) to pick up a redeploy. Negative expires = "Cache-Control: no-cache"
        location ~* \.(css|js)$ {
            expires -1;
        }

	# hotfix for info disclosure (.neon: PHPStan configs in the app root)
        location ~* \.(ini|neon)$ {
            log_not_found off;
            deny all;
        }
        location ~* \.(log)$ {
            log_not_found off;
            deny all;
        }

        # deny access to . files, for security
        # unanchored on purpose: must match a dotfile anywhere in the path (Gixy flags it, keep it)
        location ~ /\. {
            log_not_found off;
            deny all;
     }

 location /ws/map/update {
    # at most 10 open WebSocket connections per client IP. Tabs in one browser profile
    # share one connection (SharedWorker), so 10 is browser profiles/devices per IP.
    # limit_req also caps how fast handshakes can be opened and closed.
    limit_conn ws 10;
    limit_conn_status 429;
    limit_req zone=pages burst=20 nodelay;
    limit_req_status 429;
    # look pf-socket up again (Docker DNS, 10s cache), so a pf-socket restart with a new IP
    # does not break live map updates until pf restarts. A fixed upstream resolves only once.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $websocket_host ${PATHFINDER_SOCKET_HOST};
    proxy_pass http://$websocket_host:8020;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;

    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 8h;
    proxy_send_timeout 5s;
    proxy_connect_timeout 3s;
    # WebSocket-only location: after the upgrade nginx relays frames unbuffered anyway (Gixy flags it, harmless)
    proxy_buffering off;
  }
  # static sources
  location /public/ {
    sendfile                                    on;
    tcp_nopush                                  on;
    tcp_nodelay                                 on;
    keepalive_timeout                           10s;
    sendfile_max_chunk                          512k;
  }

}
