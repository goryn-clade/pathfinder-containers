[supervisord]
nodaemon=true
user=root
; warn: hides the INFO line for every orphaned cron job supervisord reaps as PID 1
; ("reaped unknown pid"). Unexpected program exits are still logged (WARN)
loglevel=warn
[program:php-fpm]
command=php-fpm83 -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:cron]
command = /usr/sbin/crond -f -l 8
autostart=true
autorestart=true
